<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昆山飘得华电子材料有限公司产品客户管理系统</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0f172a;
      --color-surface: #1e293b;
      --color-surface-elevated: #334155;
      --color-primary: #38bdf8;
      --color-primary-dim: #0ea5e9;
      --color-accent: #22d3ee;
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
      --color-border: #475569;
      --color-success: #22c55e;
      --color-warning: #f59e0b;
      --color-error: #ef4444;
      --radius: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --font: 'Noto Sans SC', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56,189,248,0.12), transparent),
        linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    }

    .app-header {
      padding: 16px 24px;
      background: rgba(30,41,59,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.02em;
    }
    .nav-tabs {
      display: flex;
      gap: 4px;
    }
    .nav-tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      font-family: var(--font);
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.2s ease;
    }
    .nav-tab:hover { color: var(--color-text); background: rgba(255,255,255,0.05); }
    .nav-tab.active { color: var(--color-primary); background: rgba(56,189,248,0.15); }

    .main { padding: 24px; max-width: 1600px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 监控界面 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-label { color: var(--color-text-muted); font-size: 0.875rem; margin-bottom: 4px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--color-primary); }

    .data-section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }
    .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: var(--color-text); }
    .entity-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .entity-chip {
      padding: 10px 16px;
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
    }
    .entity-chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .entity-chip.product { border-left: 3px solid var(--color-accent); }
    .entity-chip.customer { border-left: 3px solid var(--color-primary); }

    /* 弹窗 */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      max-width: 90vw;
      max-height: 80vh;
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.2s;
    }
    .modal-overlay.show .modal { transform: scale(1); }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 1.1rem; font-weight: 600; }
    .modal-close {
      background: none; border: none; color: var(--color-text-muted);
      font-size: 1.5rem; cursor: pointer;
    }
    .modal-body { padding: 20px; overflow-y: auto; max-height: 60vh; }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .detail-table th, .detail-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--color-border);
    }
    .detail-table th { color: var(--color-text-muted); font-weight: 500; }

    /* 数据管理界面 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--color-primary); color: var(--color-bg); }
    .btn-primary:hover { background: var(--color-primary-dim); }
    .btn-secondary { background: var(--color-surface-elevated); color: var(--color-text); border: 1px solid var(--color-border); }
    .btn-secondary:hover { background: var(--color-border); }
    .btn-danger { background: var(--color-error); color: white; }
    .btn-danger:hover { opacity: 0.9; }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    .data-table th, .data-table td {
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      min-width: 120px;
    }
    /* 客户名称等长文本列加宽，避免遮挡 */
    .data-table td.col-wide { min-width: 180px; }
    .data-table th.col-wide { min-width: 180px; }
    .data-table th {
      background: var(--color-surface-elevated);
      font-weight: 600;
      vertical-align: top;
    }
    .data-table td { background: var(--color-surface); }
    .data-table input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--color-text);
      font-family: var(--font);
    }
    .data-table input:focus {
      outline: none;
      border-color: var(--color-primary);
      background: rgba(56,189,248,0.1);
    }
    .col-header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .col-header input {
      width: 100%;
      min-width: 80px;
      padding: 4px 6px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: inherit;
      font-weight: 600;
      text-align: center;
    }
    .col-header input:hover { border-color: var(--color-border); }
    .col-header input:focus { border-color: var(--color-primary); background: rgba(56,189,248,0.1); outline: none; }
    .col-actions { 
      display: flex; 
      gap: 4px; 
      justify-content: center;
      flex-wrap: wrap;
    }
    .col-actions button {
      padding: 3px 6px;
      font-size: 0.7rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .col-actions button:hover { color: var(--color-primary); border-color: var(--color-primary); }
    .sub-col-header {
      font-weight: 500;
      color: var(--color-text-muted);
    }
    .sub-col-header .col-header input { font-weight: 500; }
    .row-actions button {
      padding: 4px 8px;
      font-size: 0.75rem;
      background: transparent;
      border: none;
      color: var(--color-error);
      cursor: pointer;
    }
    .row-actions button:hover { text-decoration: underline; }

    /* 列宽/行高拖拽调整 */
    .data-table th { position: relative; }
    .data-table td { position: relative; }
    .col-resize-handle {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 2;
      background: transparent;
    }
    .col-resize-handle:hover { background: var(--color-primary); opacity: 0.4; }
    body.resizing-col { cursor: col-resize; user-select: none; }

    /* 操作日志 */
    .log-list { max-height: 60vh; overflow-y: auto; }
    .log-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .log-item:hover { background: rgba(255,255,255,0.03); }
    .log-info { flex: 1; }
    .log-desc { font-size: 0.9rem; }
    .log-time { font-size: 0.8rem; color: var(--color-text-muted); margin-top: 4px; }
    .log-actions button {
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: var(--radius);
      border: none;
      font-family: var(--font);
      cursor: pointer;
    }
    .log-restore { background: var(--color-success); color: white; }
    .log-restore:hover { opacity: 0.9; }

    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 12px 20px;
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      animation: slideIn 0.3s ease;
    }
    .toast.success { border-left: 4px solid var(--color-success); }
    .toast.error { border-left: 4px solid var(--color-error); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .file-input { display: none; }

    /* 登录界面 */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-page.hidden { display: none; }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--shadow);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    .login-logo h1 {
      font-size: 1.25rem;
      color: var(--color-text);
      margin-bottom: 4px;
    }
    .login-logo p {
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }
    .login-form { display: flex; flex-direction: column; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label {
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }
    .form-group input {
      padding: 12px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface-elevated);
      color: var(--color-text);
      font-family: var(--font);
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .form-group input::placeholder { color: var(--color-text-muted); }
    .login-btn {
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      color: var(--color-bg);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
    .login-btn:active { transform: scale(0.98); }
    .login-error {
      padding: 12px;
      background: rgba(239,68,68,0.15);
      border: 1px solid var(--color-error);
      border-radius: var(--radius);
      color: var(--color-error);
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }
    .login-error.show { display: block; }

    /* 主应用容器 */
    .app-container { display: none; }
    .app-container.show { display: block; }

    /* 用户信息 & 退出按钮 */
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-name {
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }
    .logout-btn {
      padding: 8px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--color-text-muted);
      font-family: var(--font);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:hover {
      border-color: var(--color-error);
      color: var(--color-error);
    }
  </style>
</head>
<body>
  <!-- 登录界面 -->
  <div class="login-page" id="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">📊</div>
        <h1>昆山飘得华电子材料有限公司</h1>
        <p>产品客户管理系统</p>
      </div>
      <form class="login-form" id="login-form">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <div class="login-error" id="login-error">用户名或密码错误</div>
        <button type="submit" class="login-btn">登 录</button>
      </form>
    </div>
  </div>

  <!-- 主应用 -->
  <div class="app-container" id="app-container">
  <header class="app-header">
    <h1 class="app-title">昆山飘得华电子材料有限公司产品客户管理系统</h1>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-panel="monitor">监控界面</button>
      <button class="nav-tab" data-panel="data">数据管理</button>
      <button class="nav-tab" data-panel="log">操作日志</button>
    </nav>
    <div class="user-info">
      <span class="user-name" id="current-user"></span>
      <button class="logout-btn" id="logout-btn">退出登录</button>
    </div>
  </header>

  <main class="main">
    <!-- 监控界面 -->
    <section class="panel active" id="panel-monitor">
      <div class="dashboard-grid" id="stats-grid"></div>
      <div class="data-section">
        <h3 class="section-title">客户列表（点击查看该客户使用的产品及详情）</h3>
        <div class="entity-grid" id="customer-grid"></div>
      </div>
      <div class="data-section">
        <h3 class="section-title">产品列表（点击查看使用该产品的客户及详情）</h3>
        <div class="entity-grid" id="product-grid"></div>
      </div>
    </section>

    <!-- 数据管理界面 -->
    <section class="panel" id="panel-data">
      <div class="toolbar">
        <button class="btn btn-primary" id="btn-add-row">添加行</button>
        <button class="btn btn-secondary" id="btn-add-col">添加列</button>
        <button class="btn btn-secondary" id="btn-add-subcol">添加子列</button>
        <button class="btn btn-secondary" id="btn-export">导出 Excel</button>
        <input type="file" class="file-input" id="file-import" accept=".xlsx,.xls">
        <button class="btn btn-secondary" id="btn-import">导入 Excel</button>
      </div>
      <div class="table-wrapper">
        <table class="data-table" id="data-table"></table>
      </div>
    </section>

    <!-- 操作日志界面 -->
    <section class="panel" id="panel-log">
      <h3 class="section-title">操作历史（点击“恢复”可还原到该操作之前的状态）</h3>
      <div class="log-list" id="log-list"></div>
    </section>
  </main>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">详情</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <table class="detail-table" id="detail-table"></table>
      </div>
    </div>
  </div>
  </div><!-- /app-container -->

  <div class="toast-container" id="toast-container"></div>

  <script>
    // ============ 登录模块 ============
    const TEST_ACCOUNTS = [
      { username: 'admin', password: 'admin123', role: '管理员' },
      { username: 'user', password: 'user123', role: '普通用户' }
    ];
    const SESSION_KEY = 'pdh_session';

    function checkLogin() {
      const session = localStorage.getItem(SESSION_KEY);
      if (session) {
        try {
          const user = JSON.parse(session);
          if (user && user.username) {
            showApp(user);
            return true;
          }
        } catch (e) {}
      }
      showLogin();
      return false;
    }

    function showLogin() {
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('app-container').classList.remove('show');
    }

    function showApp(user) {
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('app-container').classList.add('show');
      document.getElementById('current-user').textContent = `${user.role}: ${user.username}`;
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      
      const account = TEST_ACCOUNTS.find(a => a.username === username && a.password === password);
      if (account) {
        errorEl.classList.remove('show');
        const session = { username: account.username, role: account.role, loginTime: Date.now() };
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        showApp(session);
        initApp();
      } else {
        errorEl.classList.add('show');
      }
    }

    function handleLogout() {
      localStorage.removeItem(SESSION_KEY);
      showLogin();
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    // ============ 数据模块 ============
    const STORAGE_KEYS = { columns: 'pdh_columns', rows: 'pdh_rows', logs: 'pdh_logs', colWidths: 'pdh_col_widths' };

    function getColWidths() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.colWidths) || '{}'); }
    function saveColWidths(v) { localStorage.setItem(STORAGE_KEYS.colWidths, JSON.stringify(v)); }

    function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

    function getColumns() {
      const raw = localStorage.getItem(STORAGE_KEYS.columns);
      if (raw) return JSON.parse(raw);
      return [
        { id: 'col_customer', label: '客户名称', parentId: null, order: 0 },
        { id: 'col_product', label: '产品名称', parentId: null, order: 1 },
        { id: 'col_spec', label: '规格型号', parentId: null, order: 2 },
        { id: 'col_analysis', label: '药水分析项目', parentId: null, order: 3 },
        { id: 'col_analysis_ph', label: 'PH值', parentId: 'col_analysis', order: 0 },
        { id: 'col_analysis_density', label: '密度(g/ml)', parentId: 'col_analysis', order: 1 },
        { id: 'col_analysis_copper', label: '铜含量(g/L)', parentId: 'col_analysis', order: 2 },
        { id: 'col_usage', label: '月用量(kg)', parentId: null, order: 4 },
        { id: 'col_batch', label: '批次号', parentId: null, order: 5 },
        { id: 'col_date', label: '供货日期', parentId: null, order: 6 },
        { id: 'col_contact', label: '联系人', parentId: null, order: 7 }
      ];
    }

    function getRows() {
      const raw = localStorage.getItem(STORAGE_KEYS.rows);
      if (raw) return JSON.parse(raw);
      return [
        { id: 'row_1', cells: { col_customer: '苏州华星光电', col_product: 'PDH-101铜蚀刻液', col_spec: '25L/桶', col_analysis_ph: '2.5', col_analysis_density: '1.18', col_analysis_copper: '45', col_usage: '500', col_batch: 'PDH20240115-01', col_date: '2024-01-15', col_contact: '张经理' }, createdAt: '2024-01-15' },

    function getLogs() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.logs) || '[]'); }

    function saveColumns(v) { localStorage.setItem(STORAGE_KEYS.columns, JSON.stringify(v)); }
    function saveRows(v) { localStorage.setItem(STORAGE_KEYS.rows, JSON.stringify(v)); }
    function saveLogs(v) { localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify(v)); }

    function logOp(type, action, payload) {
      const logs = getLogs();
      logs.unshift({
        id: genId(),
        type, action, payload,
        timestamp: new Date().toLocaleString()
      });
      saveLogs(logs);
    }

    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function getColById(columns, id) { return columns.find(c => c.id === id); }
    function getTopCols(columns) { return columns.filter(c => !c.parentId).sort((a,b) => a.order - b.order); }
    function getChildCols(columns, parentId) { return columns.filter(c => c.parentId === parentId).sort((a,b) => a.order - b.order); }

    function isCustomerCol(col) { return /客户|客户名称|customer/i.test(col.label); }
    function isProductCol(col) { return /产品|产品名称|用量|批次|规格|product/i.test(col.label); }

    function recordState() {
      return { columns: JSON.parse(JSON.stringify(getColumns())), rows: JSON.parse(JSON.stringify(getRows())) };
    }

    function restoreState(state) {
      saveColumns(state.columns);
      saveRows(state.rows);
      renderDataTable();
      renderMonitor();
      renderLogs();
      toast('已恢复到该操作之前的状态', 'success');
    }

    function addColumn(parentId = null) {
      const prev = recordState();
      const columns = getColumns();
      const label = parentId ? '子列' : '新列';
      const siblings = parentId ? getChildCols(columns, parentId) : getTopCols(columns);
      const order = siblings.length;
      const col = { id: genId(), label, parentId, order };
      columns.push(col);
      // 仅修改列定义（第一行/表头），不同步修改数据行
      saveColumns(columns);
      logOp('column', 'add', prev);
      renderDataTable();
      toast('已添加列');
    }

    function deleteColumn(id) {
      const prev = recordState();
      const columns = getColumns();
      const toDel = [id, ...columns.filter(c => c.parentId === id).map(c => c.id)];
      toDel.forEach(did => {
        const idx = columns.findIndex(c => c.id === did);
        if (idx >= 0) columns.splice(idx, 1);
      });
      // 仅删除列定义（第一行/表头），不同步删除数据行中的数据
      saveColumns(columns);
      logOp('column', 'delete', prev);
      renderDataTable();
      toast('已删除列');
    }

    function renameColumn(id, newLabel) {
      const columns = getColumns();
      const col = getColById(columns, id);
      if (!col) return;
      const prev = recordState();
      col.label = newLabel;
      saveColumns(columns);
      logOp('column', 'update', prev);
      renderDataTable();
    }

    function addRow() {
      const rows = getRows();
      const cols = getColumns();
      const cells = {};
      cols.forEach(c => { cells[c.id] = ''; });
      rows.push({ id: genId(), cells, createdAt: new Date().toISOString() });
      const prev = recordState();
      saveRows(rows);
      logOp('row', 'add', prev);
      renderDataTable();
      toast('已添加行');
    }

    function deleteRow(id) {
      const rows = getRows().filter(r => r.id !== id);
      const prev = recordState();
      saveRows(rows);
      logOp('row', 'delete', prev);
      renderDataTable();
      toast('已删除行');
    }

    function updateCell(rowId, colId, value) {
      const rows = getRows();
      const row = rows.find(r => r.id === rowId);
      if (!row) return;
      const prev = recordState();
      row.cells[colId] = value;
      saveRows(rows);
      logOp('cell', 'update', prev);
    }

    function renderDataTable() {
      const cols = getColumns();
      const rows = getRows();
      const topCols = getTopCols(cols);
      const colWidths = getColWidths();
      const thead = document.createElement('thead');
      const tr1 = document.createElement('tr');
      const tr2 = document.createElement('tr');
      
      // 检查是否有任何父列包含子列
      const hasAnyChildren = topCols.some(tc => getChildCols(cols, tc.id).length > 0);
      
      topCols.forEach(tc => {
        const childCols = getChildCols(cols, tc.id);
        if (childCols.length > 0) {
          // 父列 + 子列一起占多列，父列作为第一个子列展示
          const th = document.createElement('th');
          th.colSpan = 1 + childCols.length;
          th.innerHTML = `
            <div class="col-header">
              <input type="text" value="${tc.label}" data-id="${tc.id}">
              <div class="col-actions">
                <button data-action="add-sub" data-parent="${tc.id}">+子列</button>
                <button data-action="del-col" data-id="${tc.id}">删除列</button>
              </div>
            </div>`;
          tr1.appendChild(th);
          // 第二行：先显示原列（父列）作为第一个子列，再显示其余子列
          const thParent = document.createElement('th');
          thParent.className = 'sub-col-header';
          thParent.dataset.colId = tc.id;
          if (colWidths[tc.id]) thParent.style.minWidth = colWidths[tc.id] + 'px';
          if (isCustomerCol(tc)) thParent.classList.add('col-wide');
          thParent.innerHTML = `
            <div class="col-header">
              <input type="text" value="${tc.label}" data-id="${tc.id}">
            </div>`;
          const handleP = document.createElement('div');
          handleP.className = 'col-resize-handle';
          handleP.dataset.colId = tc.id;
          thParent.appendChild(handleP);
          tr2.appendChild(thParent);
          childCols.forEach(cc => {
            const th2 = document.createElement('th');
            th2.className = 'sub-col-header';
            th2.dataset.colId = cc.id;
            if (colWidths[cc.id]) th2.style.minWidth = colWidths[cc.id] + 'px';
            th2.innerHTML = `
              <div class="col-header">
                <input type="text" value="${cc.label}" data-id="${cc.id}">
                <div class="col-actions">
                  <button data-action="del-col" data-id="${cc.id}">删除</button>
                </div>
              </div>`;
            const handle2 = document.createElement('div');
            handle2.className = 'col-resize-handle';
            handle2.dataset.colId = cc.id;
            th2.appendChild(handle2);
            tr2.appendChild(th2);
          });
        } else {
          const th = document.createElement('th');
          th.dataset.colId = tc.id;
          if (colWidths[tc.id]) th.style.minWidth = colWidths[tc.id] + 'px';
          if (isCustomerCol(tc)) th.classList.add('col-wide');
          // 如果有其他列包含子列，则此列需要跨两行
          if (hasAnyChildren) th.rowSpan = 2;
          th.innerHTML = `
            <div class="col-header">
              <input type="text" value="${tc.label}" data-id="${tc.id}">
              <div class="col-actions">
                <button data-action="add-sub" data-parent="${tc.id}">+子列</button>
                <button data-action="del-col" data-id="${tc.id}">删除列</button>
              </div>
            </div>`;
          const handle = document.createElement('div');
          handle.className = 'col-resize-handle';
          handle.dataset.colId = tc.id;
          th.appendChild(handle);
          tr1.appendChild(th);
        }
      });
      
      // 操作列
      const thActions = document.createElement('th');
      if (hasAnyChildren) thActions.rowSpan = 2;
      thActions.textContent = '操作';
      thActions.style.width = '80px';
      thActions.style.textAlign = 'center';
      tr1.appendChild(thActions);
      
      thead.appendChild(tr1);
      // 只有当存在子列时才添加第二行表头
      if (hasAnyChildren) thead.appendChild(tr2);

      const tbody = document.createElement('tbody');
      // 有子列时：父列作为第一个子列展示（保留原列数据），再展示各子列
      const flatCols = topCols.flatMap(tc => {
        const children = getChildCols(cols, tc.id);
        return children.length > 0 ? [tc, ...children] : [tc];
      });
      function escapeAttr(s) {
        return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      rows.forEach(row => {
        const tr = document.createElement('tr');
        flatCols.forEach(col => {
          const td = document.createElement('td');
          td.dataset.colId = col.id;
          if (colWidths[col.id]) td.style.minWidth = colWidths[col.id] + 'px';
          const val = row.cells[col.id] || '';
          if (isCustomerCol(col) || (col.parentId && isCustomerCol(getColById(cols, col.parentId)))) td.classList.add('col-wide');
          const inputHtml = val ? `<input type="text" value="${escapeAttr(val)}" data-row="${row.id}" data-col="${col.id}" title="${escapeAttr(val)}">` : `<input type="text" value="" data-row="${row.id}" data-col="${col.id}">`;
          td.innerHTML = inputHtml;
          tr.appendChild(td);
        });
        const tdAct = document.createElement('td');
        tdAct.innerHTML = `<div class="row-actions"><button data-action="del-row" data-id="${row.id}">删除</button></div>`;
        tr.appendChild(tdAct);
        tbody.appendChild(tr);
      });

      const table = document.getElementById('data-table');
      table.innerHTML = '';
      table.appendChild(thead);
      table.appendChild(tbody);

      table.querySelectorAll('input[data-id]').forEach(inp => {
        inp.addEventListener('blur', () => {
          const id = inp.dataset.id;
          const cur = getColById(cols, id);
          if (cur && cur.label !== inp.value) renameColumn(id, inp.value);
        });
      });
      table.querySelectorAll('input[data-row]').forEach(inp => {
        inp.addEventListener('blur', () => {
          const rowId = inp.dataset.row, colId = inp.dataset.col;
          const row = rows.find(r => r.id === rowId);
          if (row && (row.cells[colId] || '') !== inp.value) updateCell(rowId, colId, inp.value);
          inp.title = inp.value || '';
        });
      });
      table.querySelectorAll('input[data-row]').forEach(inp => {
        inp.addEventListener('input', () => { inp.title = inp.value || ''; });
      });
      table.querySelectorAll('[data-action="del-col"]').forEach(btn => {
        btn.onclick = () => deleteColumn(btn.dataset.id);
      });
      table.querySelectorAll('[data-action="add-sub"]').forEach(btn => {
        btn.onclick = () => addColumn(btn.dataset.parent);
      });
      table.querySelectorAll('[data-action="del-row"]').forEach(btn => {
        btn.onclick = () => deleteRow(btn.dataset.id);
      });

      // 列宽拖拽
      table.querySelectorAll('.col-resize-handle').forEach(handle => {
        handle.onmousedown = (e) => {
          e.preventDefault();
          const colId = handle.dataset.colId;
          const th = handle.closest('th');
          const startX = e.pageX;
          const startW = th.offsetWidth;
          document.body.classList.add('resizing-col');
          const onMove = (ev) => {
            const dw = ev.pageX - startX;
            const newW = Math.max(80, startW + dw);
            th.style.minWidth = newW + 'px';
            table.querySelectorAll(`td[data-col-id="${colId}"]`).forEach(td => td.style.minWidth = newW + 'px');
          };
          const onUp = () => {
            document.body.classList.remove('resizing-col');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            const w = th.offsetWidth;
            const cw = getColWidths();
            cw[colId] = w;
            saveColWidths(cw);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        };
      });

    }

    function renderMonitor() {
      const cols = getColumns();
      const rows = getRows();
      const flatCols = getTopCols(cols).flatMap(tc => {
        const children = getChildCols(cols, tc.id);
        return children.length > 0 ? children : [tc];
      });
      const customerColId = flatCols.find(c => isCustomerCol(c) || (c.parentId && isCustomerCol(getColById(cols, c.parentId))))?.id || flatCols[0]?.id;
      const productColIds = flatCols.filter(c => isProductCol(c) || (c.parentId && isProductCol(getColById(cols, c.parentId)))).map(c => c.id);
      if (productColIds.length === 0) productColIds.push(...flatCols.filter(c => c.id !== customerColId).map(c => c.id));

      const customers = new Set();
      const products = new Set();
      const customerProducts = {};
      const productCustomers = {};
      const customerDetails = {};
      const productDetails = {};

      rows.forEach(row => {
        const custVal = customerColId ? (row.cells[customerColId] || '').trim() : '';
        if (custVal) {
          customers.add(custVal);
          if (!customerProducts[custVal]) customerProducts[custVal] = [];
          if (!customerDetails[custVal]) customerDetails[custVal] = [];
          const detail = {};
          flatCols.forEach(c => { detail[c.label] = row.cells[c.id] || ''; });
          customerDetails[custVal].push(detail);
          productColIds.forEach(pid => {
            const pval = (row.cells[pid] || '').trim();
            if (pval) {
              products.add(pval);
              if (!customerProducts[custVal].includes(pval)) customerProducts[custVal].push(pval);
              if (!productCustomers[pval]) productCustomers[pval] = [];
              if (!productCustomers[pval].includes(custVal)) productCustomers[pval].push(custVal);
              if (!productDetails[pval]) productDetails[pval] = [];
              productDetails[pval].push(detail);
            }
          });
        }
      });

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-label">客户总数</div><div class="stat-value">${customers.size}</div></div>
        <div class="stat-card"><div class="stat-label">产品总数</div><div class="stat-value">${products.size}</div></div>
        <div class="stat-card"><div class="stat-label">数据行数</div><div class="stat-value">${rows.length}</div></div>
      `;

      const custGrid = document.getElementById('customer-grid');
      custGrid.innerHTML = '';
      [...customers].sort().forEach(c => {
        const chip = document.createElement('div');
        chip.className = 'entity-chip customer';
        chip.textContent = c;
        chip.onclick = () => showDetailModal(c + ' - 使用的产品及详情', customerDetails[c] || [], flatCols);
        custGrid.appendChild(chip);
      });

      const prodGrid = document.getElementById('product-grid');
      prodGrid.innerHTML = '';
      [...products].sort().forEach(p => {
        const chip = document.createElement('div');
        chip.className = 'entity-chip product';
        chip.textContent = p;
        chip.onclick = () => showDetailModal(p + ' - 使用的客户及详情', productDetails[p] || [], flatCols);
        prodGrid.appendChild(chip);
      });
    }

    function showDetailModal(title, rows, cols) {
      document.getElementById('modal-title').textContent = title;
      const table = document.getElementById('detail-table');
      table.innerHTML = '';
      if (rows.length === 0) {
        table.innerHTML = '<tr><td>暂无数据</td></tr>';
      } else {
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr>' + cols.map(c => `<th>${c.label}</th>`).join('') + '</tr>';
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        rows.forEach(r => {
          const tr = document.createElement('tr');
          cols.forEach(c => tr.appendChild(document.createElement('td')).textContent = r[c.label] || '');
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
      }
      document.getElementById('detail-modal').classList.add('show');
    }

    function renderLogs() {
      const logs = getLogs();
      const list = document.getElementById('log-list');
      list.innerHTML = '';
      logs.forEach(log => {
        const actionMap = { add: '添加', delete: '删除', update: '更新' };
        const typeMap = { column: '列', row: '行', cell: '单元格' };
        const desc = `${actionMap[log.action] || log.action}${typeMap[log.type] || log.type}`;
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `
          <div class="log-info">
            <div class="log-desc">${desc}</div>
            <div class="log-time">${log.timestamp}</div>
          </div>
          <button class="log-restore" data-id="${log.id}">恢复到此操作前</button>`;
        div.querySelector('button').onclick = () => {
          const item = logs.find(l => l.id === log.id);
          if (item && item.payload) restoreState(item.payload);
        };
        list.appendChild(div);
      });
    }

    function exportExcel() {
      const cols = getColumns();
      const rows = getRows();
      const topCols = getTopCols(cols);
      const flatCols = topCols.flatMap(tc => {
        const children = getChildCols(cols, tc.id);
        return children.length > 0 ? children : [tc];
      });
      const headers = flatCols.map(c => c.label);
      const data = [headers, ...rows.map(r => flatCols.map(c => r.cells[c.id] || ''))];
      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '数据');
      XLSX.writeFile(wb, '昆山飘得华产品客户数据.xlsx');
      toast('导出成功');
    }

    function importExcel(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          if (!wb.SheetNames || wb.SheetNames.length === 0) {
            toast('Excel 文件为空或格式不正确', 'error');
            return;
          }
          const ws = wb.Sheets[wb.SheetNames[0]];
          const arr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          
          // 过滤空行
          const filteredArr = arr.filter(row => row && row.some(cell => cell !== '' && cell != null));
          if (filteredArr.length < 1) { toast('文件中没有有效数据', 'error'); return; }
          
          const headers = filteredArr[0];
          if (!headers || headers.length === 0) { toast('文件缺少表头', 'error'); return; }
          
          const prev = recordState();
          const columns = getColumns();
          const flatCols = getTopCols(columns).flatMap(tc => {
            const children = getChildCols(columns, tc.id);
            return children.length > 0 ? children : [tc];
          });
          
          // 建立列名到列ID的映射（优先匹配现有列）
          const colMap = {};
          const newCols = [];
          headers.forEach((h, i) => {
            const label = String(h || '').trim().replace(/[\r\n]/g, '') || '列' + (i + 1);
            // 先在叶子列中查找
            let col = flatCols.find(c => c.label === label);
            // 再在所有列中查找
            if (!col) col = columns.find(c => c.label === label);
            // 都没找到则创建新列
            if (!col) {
              col = { id: genId(), label, parentId: null, order: columns.length + newCols.length };
              newCols.push(col);
            }
            colMap[i] = col.id;
          });
          columns.push(...newCols);
          
          // 获取现有行数据，建立唯一键索引（使用第一列+第二列作为复合键）
          const existingRows = getRows();
          const keyColIds = Object.values(colMap).slice(0, 2);
          const rowKeyMap = {};
          existingRows.forEach(r => {
            const key = keyColIds.map(cid => (r.cells[cid] || '').trim()).join('||');
            if (key && key !== '||') rowKeyMap[key] = r;
          });
          
          // 处理导入数据
          let addedCount = 0, updatedCount = 0;
          const newRows = [];
          for (let i = 1; i < filteredArr.length; i++) {
            const rowData = filteredArr[i] || [];
            // 跳过全空行
            if (rowData.every(v => v === '' || v == null)) continue;
            
            const cells = {};
            rowData.forEach((val, j) => {
              const colId = colMap[j];
              if (colId) {
                // 处理特殊字符，保留原值
                cells[colId] = val != null ? String(val).trim() : '';
              }
            });
            
            // 检查是否为重复数据
            const key = keyColIds.map(cid => (cells[cid] || '').trim()).join('||');
            if (key && key !== '||' && rowKeyMap[key]) {
              // 重复数据：以 Excel 为准更新
              Object.assign(rowKeyMap[key].cells, cells);
              updatedCount++;
            } else {
              // 新数据
              newRows.push({ id: genId(), cells, createdAt: new Date().toISOString() });
              addedCount++;
            }
          }
          
          // 合并数据：保留被更新的现有行 + 新增行
          const finalRows = [...existingRows, ...newRows];
          
          saveColumns(columns);
          saveRows(finalRows);
          logOp('import', 'excel', prev);
          renderDataTable();
          renderMonitor();
          
          let msg = '导入完成';
          if (addedCount > 0) msg += `，新增 ${addedCount} 条`;
          if (updatedCount > 0) msg += `，更新 ${updatedCount} 条`;
          if (newCols.length > 0) msg += `，新增 ${newCols.length} 列`;
          toast(msg);
        } catch (err) {
          console.error('导入错误：', err);
          toast('导入失败：' + (err.message || '文件解析错误，请检查格式'), 'error');
        }
      };
      reader.onerror = () => toast('文件读取失败', 'error');
      reader.readAsArrayBuffer(file);
    }

    // ============ 初始化应用 ============
    function initApp() {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.onclick = () => {
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
          if (tab.dataset.panel === 'monitor') renderMonitor();
          if (tab.dataset.panel === 'log') renderLogs();
        };
      });

      document.getElementById('modal-close').onclick = () => document.getElementById('detail-modal').classList.remove('show');
      document.getElementById('detail-modal').onclick = (e) => { if (e.target.id === 'detail-modal') e.target.classList.remove('show'); };

      document.getElementById('btn-add-row').onclick = addRow;
      document.getElementById('btn-add-col').onclick = () => addColumn(null);
      document.getElementById('btn-add-subcol').onclick = () => {
        const topCols = getTopCols(getColumns());
        const parent = topCols[0];
        if (parent) addColumn(parent.id); else toast('请先添加父列', 'error');
      };
      document.getElementById('btn-export').onclick = exportExcel;
      document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
      document.getElementById('file-import').onchange = (e) => {
        const f = e.target.files[0];
        if (f) importExcel(f);
        e.target.value = '';
      };

      renderDataTable();
      renderMonitor();
      renderLogs();
    }

    // ============ 页面启动 ============
    document.getElementById('login-form').addEventListener('submit', handleLogin);
    document.getElementById('logout-btn').addEventListener('click', handleLogout);
    
    // 检查登录状态
    if (checkLogin()) {
      initApp();
    }
  </script>
</body>
